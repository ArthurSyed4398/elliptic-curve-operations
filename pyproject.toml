[project]
name = "elliptic-curve-operations"
version = "0.1.0"
description = "Point addition and scalar multiplication on a given Weierstrass curve over a prime field for cryptographic prototyping."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
